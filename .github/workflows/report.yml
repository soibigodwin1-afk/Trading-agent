name: Reporting and Calibration

on:
  schedule:
    # Runs daily; report.py itself decides whether a weekly digest
    # and/or monthly analysis is actually due, and skips silently
    # if there's nothing new to report. Also polls for Accept/Decline
    # button presses on any pending calibration proposals every run,
    # since this isn't a long-running server.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reporting + calibration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report.py

      - name: Commit updated state
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update report/calibration state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
